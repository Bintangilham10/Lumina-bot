name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Syntax and compile check
        run: python -m compileall -q core utils app.py main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          # ChromaDB has no fixed release for these advisories yet; keep auditing all other packages.
          python -m pip_audit -r requirements.txt \
            --ignore-vuln CVE-2026-45829 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t lumina-doc:ci .
